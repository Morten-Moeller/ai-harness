# Harness configuration. Copied once by bootstrap.sh, then owned by the project.
#
# Shape: keep it flat. Scalars as `key: value`, lists as `- item` lines under their key.
# The hooks and scripts parse this file with awk; nested maps deeper than one level, inline
# lists and anchors are not supported.

# Language of spec and ADR documents and of every output for people (reports, PR bodies).
doc_language: de

# Branch that pull requests target and that risk-level.sh diffs against.
default_branch: main

# Directories with source code. The Stop hook reminds about uncommitted changes under them.
source_paths:
  - src

# Make target that regenerates the committed generated files (contracts, API types). The gate
# `make drift` runs it and fails when a committed copy differs (harness/quality-gates.md).
# Empty = no generated files.
contracts_generate_target: ""

# End-to-end tests in CI: true runs `make e2e` as the required check `gates (e2e)`; the tests must
# start the application themselves. false: `make e2e` runs locally (project-rules/testing.md) and
# the check passes without running.
e2e_in_ci: false

# Release lines of the stack (harness/policies/versions.md, decision 0021). One entry per runtime,
# language, framework, database and base image: "<product> <line>", with the product and line
# names of https://endoflife.date. An entry on a line older than the newest LTS line names the ADR
# with the reason: "<product> <line> adr:<NNNN>". `make deps` fails for a line without support and
# for a newer LTS line without ADR. Lookup: harness/scripts/stack-check.sh --latest <product>.
# Example:
#   - "eclipse-temurin 25"
#   - "nodejs 24 adr:0003"
stack:

# Days after a line became LTS before `make deps` fails for a stack entry on an older line.
stack_lts_grace_days: 30

# Daily run of `make deps` on the default branch (.github/workflows/security-watch.yml). Set true
# with the first production release. A finding fails the run and goes to Slack when the secret
# SECURITY_WATCH_SLACK_WEBHOOK is set.
security_watch: false

# The size escalator: more changed lines than this raises low to medium.
low_risk_max_lines: 200

# Automatic merge (see harness/policies/auto-merge.md).
auto_merge_enabled: true
auto_merge_allowlist:
  - "dependabot[bot]"
  - "Morten-Moeller"

# Human gate G2 for medium and high risk (harness/policies/human-approval.md). The person who
# directs the work reads the PR and sets this label. Empty disables the label; then only an
# approving review by another person passes the gate.
human_approval_label: human-approved

# Require an approving review by a second person: "" (never), "high", or "medium" (medium and high).
second_reviewer_for: ""
# Gate G3: the head commit needs the status verified, set by /verify, before the gate passes:
# "high" (the default when the key is missing), "medium" (medium and high), or "" (never).
# Pull requests by bots are exempt.
verify_required_for: high

# Gate G2 per level (decision 0023): "medium" (the default when the key is missing) needs the
# label or an approval for medium and high, "high" only for high, "" for no level. An exempt level
# merges on the machine evidence: the gates, review-rules, ai-review and the status verified, which
# is then required whatever verify_required_for says. The label needs-human on a pull request and a
# level in second_reviewer_for put G2 back. Meant for test projects, never for production data.
human_gate_for: medium

# /wave (decision 0020): at most this many specs are implemented at the same time, one worktree
# and one implementer agent each. 1 runs one spec at a time.
parallel_max: 3

# /wave (decision 0023): true waits for the merge of every pull request of a wave, then starts the
# next wave of docs/roadmap.md (approved specs at once, new specs after the approval question). A
# pull request that does not merge stops the loop. false ends at the pull requests.
wave_continue: false

# Command a worker runs in its new worktree before it implements, as one quoted string. Add the
# dependency install of the project, for example "make setup && pnpm -C frontend install".
worktree_setup: "make setup"

# /review (harness/review.md): one combined agent run when the diff under review (the whole PR, or
# the delta of an incremental run) changes at most this many lines.
# The model and effort of the reviewer agents are set in .claude/agents/*.md.
review_combined_max_lines: 150

# Rules of harness/scripts/review-rules.sh to switch off, one per line:
# spec, adr, entscheidung, gate, kommentar, generiert, zeilenende, kriterium, contract, doku.
review_rules_disabled:
