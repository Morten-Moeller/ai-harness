name: Merge policy

# Two jobs, both required by harness/github/ruleset.json:
#   human-gate   passes for low risk at once; for medium and high with the label human-approved
#                (set by the person who reviewed) or an approving review; see decision 0006.
#   auto-merge   enables GitHub auto-merge when every condition of harness/policies/auto-merge.md
#                holds, and disables it otherwise. GitHub merges when all required checks pass.
# Policy: harness/policies/auto-merge.md, decision: harness/decisions/0004.
# Agents must not edit this file (.claude/settings.json deny rule, CODEOWNERS).

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled, converted_to_draft]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  human-gate:
    name: human-gate
    runs-on: ubuntu-latest
    outputs:
      level: ${{ steps.level.outputs.level }}
      docs_only: ${{ steps.level.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Dependabot metadata
        id: dependabot
        if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Compute the level
        id: level
        env:
          BASE: origin/${{ github.event.pull_request.base.ref }}
          UPDATE_TYPE: ${{ steps.dependabot.outputs.update-type }}
        run: |
          args=(--base "$BASE")
          if [ -n "$UPDATE_TYPE" ]; then args+=(--dependabot "$UPDATE_TYPE"); fi
          json=$(harness/scripts/risk-level.sh "${args[@]}" --format json)
          echo "level=$(printf '%s' "$json" | jq -r .level)" >> "$GITHUB_OUTPUT"
          echo "docs_only=$(printf '%s' "$json" | jq -r .docs_only)" >> "$GITHUB_OUTPUT"
          harness/scripts/risk-level.sh "${args[@]}" --format text

      - name: Gate
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          LEVEL: ${{ steps.level.outputs.level }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          if [ "$LEVEL" = low ]; then
            echo "Risk low: no human review required (G2 does not apply)."; exit 0
          fi
          label=$(awk '$1 == "human_approval_label:" { v=$2; gsub(/"/, "", v); print v; exit }' harness/config.yml)
          second=$(awk '$1 == "second_reviewer_for:" { v=$2; gsub(/"/, "", v); print v; exit }' harness/config.yml)
          decision=$(gh pr view "$PR" --json reviewDecision --jq '.reviewDecision // ""')
          if [ "$decision" = APPROVED ]; then
            echo "Risk $LEVEL: approving review by a second person present (G2)."; exit 0
          fi
          needs_second=0
          case "$second" in
            high) [ "$LEVEL" = high ] && needs_second=1 ;;
            medium) needs_second=1 ;;
          esac
          if [ "$needs_second" = 1 ]; then
            echo "Risk $LEVEL: harness/config.yml requires an approving review by a second person (second_reviewer_for: $second). reviewDecision=$decision"
            exit 1
          fi
          if [ -n "$label" ]; then
            case ",$LABELS," in
              *",$label,"*) echo "Risk $LEVEL: label '$label' set by a person (G2)."; exit 0 ;;
            esac
            echo "Risk $LEVEL: after your review set the label '$label', or get an approving review (harness/policies/human-approval.md, G2)."
            exit 1
          fi
          echo "Risk $LEVEL: an approving review by a person is required (harness/policies/human-approval.md, G2). reviewDecision=$decision"
          exit 1

  auto-merge:
    name: auto-merge
    needs: human-gate
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Decide
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN || github.token }}
          PR: ${{ github.event.pull_request.number }}
          LEVEL: ${{ needs.human-gate.outputs.level }}
          DOCS_ONLY: ${{ needs.human-gate.outputs.docs_only }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          DRAFT: ${{ github.event.pull_request.draft }}
          BASE: ${{ github.event.pull_request.base.ref }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          reason=""
          enabled=$(awk '$1 == "auto_merge_enabled:" { print $2; exit }' harness/config.yml)
          default_branch=$(awk '$1 == "default_branch:" { print $2; exit }' harness/config.yml)
          allow=$(awk '/^auto_merge_allowlist:/ { f=1; next } f && /^[ \t]*-/ { s=$0; sub(/^[ \t]*-[ \t]*/, "", s); gsub(/"/, "", s); print s; next } f && !/^[ \t]*-/ { f=0 }' harness/config.yml)
          [ "$enabled" = "true" ] || reason="auto_merge_enabled is not true"
          [ -n "$reason" ] || [ "$LEVEL" = "low" ] || reason="risk level is $LEVEL"
          [ -n "$reason" ] || [ "$DRAFT" != "true" ] || reason="draft"
          [ -n "$reason" ] || [ "$BASE" = "$default_branch" ] || reason="base is $BASE, not $default_branch"
          case ",$LABELS," in *,needs-human,*) [ -n "$reason" ] || reason="label needs-human" ;; esac
          if [ -z "$reason" ]; then
            if ! printf '%s\n' "$allow" | grep -Fxq "$AUTHOR" && [ "$DOCS_ONLY" != "true" ]; then
              reason="author $AUTHOR not on the allowlist and change is not docs-only"
            fi
          fi
          if [ -z "$reason" ]; then
            echo "Conditions met: enabling auto-merge (squash)."
            gh pr merge "$PR" --auto --squash
          else
            echo "Not enabling auto-merge: $reason"
            gh pr merge "$PR" --disable-auto 2>/dev/null || true
          fi
