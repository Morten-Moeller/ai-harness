name: AI review

# /review <PR> runs in the developer's Claude Code session and writes one PR comment per review
# (harness/review.md). CI checks that the comment for the head commit exists and reports no
# blocking findings; review-code also runs the rule check (harness/scripts/review-rules.sh, copy
# from the base branch) and sets needs-human on a changed gate. When the secret
# CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`, works with a Claude subscription) or
# ANTHROPIC_API_KEY is set, CI runs /review for the job itself before the check. /review reruns
# the failed jobs after posting, so the checks turn green for the same commit.
#
#   review-code          always, required check
#   review-security      from medium risk
#   review-architecture  for high risk or when contracts/ or docs/architecture/ changed

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scope:
    name: review-scope
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    outputs:
      pr: ${{ github.event.pull_request.number }}
      sha: ${{ github.event.pull_request.head.sha }}
      level: ${{ steps.level.outputs.level }}
      architecture: ${{ steps.level.outputs.architecture }}
      has_token: ${{ steps.token.outputs.present }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: dependabot
        if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - id: level
        env:
          BASE: origin/${{ github.base_ref }}
          UPDATE_TYPE: ${{ steps.dependabot.outputs.update-type }}
        run: |
          args=(--base "$BASE")
          if [ -n "$UPDATE_TYPE" ]; then args+=(--dependabot "$UPDATE_TYPE"); fi
          level=$(harness/scripts/risk-level.sh "${args[@]}" --format level)
          echo "level=$level" >> "$GITHUB_OUTPUT"
          if git diff --name-only "$BASE...HEAD" | grep -Eq '^(contracts/|docs/architecture/)'; then
            echo "architecture=true" >> "$GITHUB_OUTPUT"
          else
            echo "architecture=false" >> "$GITHUB_OUTPUT"
          fi
      - id: token
        env:
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          API: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$OAUTH" ] || [ -n "$API" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi

  review-code:
    name: review-code
    needs: scope
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.scope.outputs.sha }}
      - name: Run the skill in CI (only with a token)
        if: ${{ needs.scope.outputs.has_token == 'true' }}
        uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: "/review ${{ needs.scope.outputs.pr }} code --no-rerun"
          claude_args: >-
            --max-turns 80
            --allowedTools "Read,Write,Grep,Glob,Skill,Agent,Bash(gh pr view*),Bash(gh pr diff*),Bash(gh pr comment*),Bash(git diff*),Bash(git log*),Bash(git show*),Bash(git fetch*),Bash(git merge-base*),Bash(harness/scripts/risk-level.sh*),Bash(harness/scripts/review-rules.sh*)"
      - name: Rule check
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.scope.outputs.pr }}
          BASE: origin/${{ github.base_ref }}
        run: |
          base_copy() {
            if git cat-file -e "$BASE:$1" 2>/dev/null && { [ -z "$2" ] || git show "$BASE:$1" | grep -q "$2"; }; then
              git show "$BASE:$1" > "$RUNNER_TEMP/${1##*/}"
            else
              echo "$1 from the pull request (not on $BASE yet)."
              cp "$1" "$RUNNER_TEMP/${1##*/}"
            fi
          }
          base_copy harness/scripts/review-rules.sh ""
          base_copy harness/scripts/risk-level.sh ""
          base_copy harness/risk-matrix.yml '^gate_markers:'
          git diff --name-only "$BASE...HEAD" > "$RUNNER_TEMP/files.txt"
          git diff "$BASE...HEAD" > "$RUNNER_TEMP/diff.patch"
          level=$(bash "$RUNNER_TEMP/risk-level.sh" --files-from "$RUNNER_TEMP/files.txt" --diff-from "$RUNNER_TEMP/diff.patch" \
            --matrix "$RUNNER_TEMP/risk-matrix.yml" --format level)
          rules=(bash "$RUNNER_TEMP/review-rules.sh" --root "$GITHUB_WORKSPACE" --pr "$PR" --level "$level"
                 --matrix "$RUNNER_TEMP/risk-matrix.yml")
          status=0
          "${rules[@]}" --format json > "$RUNNER_TEMP/rules.json" || status=$?
          "${rules[@]}" --format markdown >> "$GITHUB_STEP_SUMMARY" || true
          if [ "$(jq -r .needs_human "$RUNNER_TEMP/rules.json")" = true ]; then
            gh pr edit "$PR" --add-label needs-human || echo "Could not set needs-human."
          fi
          jq -r '.findings[] | "\(.rule) \(.location): \(.message)"' "$RUNNER_TEMP/rules.json"
          exit "$status"
      - name: Check the review comment
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.scope.outputs.pr }}
          SHA: ${{ needs.scope.outputs.sha }}
        run: harness/scripts/check-review-comment.sh --pr "$PR" --sha "$SHA" --prefix Code-Review --skill code

  review-security:
    name: review-security
    needs: scope
    if: ${{ needs.scope.outputs.level != 'low' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.scope.outputs.sha }}
      - name: Run the skill in CI (only with a token)
        if: ${{ needs.scope.outputs.has_token == 'true' }}
        uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: "/review ${{ needs.scope.outputs.pr }} security --no-rerun"
          claude_args: >-
            --max-turns 80
            --allowedTools "Read,Write,Grep,Glob,Skill,Agent,Bash(gh pr view*),Bash(gh pr diff*),Bash(gh pr comment*),Bash(git diff*),Bash(git log*),Bash(git show*),Bash(git fetch*),Bash(git merge-base*),Bash(harness/scripts/risk-level.sh*),Bash(harness/scripts/review-rules.sh*)"
      - name: Check the review comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.scope.outputs.pr }}
          SHA: ${{ needs.scope.outputs.sha }}
        run: harness/scripts/check-review-comment.sh --pr "$PR" --sha "$SHA" --prefix Security-Review --skill security

  review-architecture:
    name: review-architecture
    needs: scope
    if: ${{ needs.scope.outputs.level == 'high' || needs.scope.outputs.architecture == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.scope.outputs.sha }}
      - name: Run the skill in CI (only with a token)
        if: ${{ needs.scope.outputs.has_token == 'true' }}
        uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: "/review ${{ needs.scope.outputs.pr }} architecture --no-rerun"
          claude_args: >-
            --max-turns 80
            --allowedTools "Read,Write,Grep,Glob,Skill,Agent,Bash(gh pr view*),Bash(gh pr diff*),Bash(gh pr comment*),Bash(git diff*),Bash(git log*),Bash(git show*),Bash(git fetch*),Bash(git merge-base*),Bash(harness/scripts/risk-level.sh*),Bash(harness/scripts/review-rules.sh*)"
      - name: Check the review comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.scope.outputs.pr }}
          SHA: ${{ needs.scope.outputs.sha }}
        run: harness/scripts/check-review-comment.sh --pr "$PR" --sha "$SHA" --prefix Architektur-Review --skill architecture
