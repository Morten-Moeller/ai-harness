name: AI review

# The review skills run in the developer's Claude Code session (/review-code <PR> and so on) and
# write one PR comment each. CI checks that the comment for the head commit exists and reports no
# blocking findings. When the secret CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`, works
# with a Claude subscription) or ANTHROPIC_API_KEY is set, CI runs the skill itself before the
# check. Without a secret nothing is called; the check alone decides. A review skill that posts
# its comment after this run reruns the failed jobs (`gh run rerun --failed`) so the check turns
# green for the same commit.
#
#   review-code          always, required check
#   review-security      from medium risk
#   review-architecture  for high risk or when contracts/ or docs/architecture/ changed

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scope:
    name: review-scope
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    outputs:
      pr: ${{ github.event.pull_request.number }}
      sha: ${{ github.event.pull_request.head.sha }}
      level: ${{ steps.level.outputs.level }}
      architecture: ${{ steps.level.outputs.architecture }}
      has_token: ${{ steps.token.outputs.present }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: level
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          level=$(harness/scripts/risk-level.sh --base "$BASE" --format level)
          echo "level=$level" >> "$GITHUB_OUTPUT"
          if git diff --name-only "$BASE...HEAD" | grep -Eq '^(contracts/|docs/architecture/)'; then
            echo "architecture=true" >> "$GITHUB_OUTPUT"
          else
            echo "architecture=false" >> "$GITHUB_OUTPUT"
          fi
      - id: token
        env:
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          API: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$OAUTH" ] || [ -n "$API" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi

  review-code:
    name: review-code
    needs: scope
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.scope.outputs.sha }}
      - name: Run the skill in CI (only with a token)
        if: ${{ needs.scope.outputs.has_token == 'true' }}
        uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: "/review-code ${{ needs.scope.outputs.pr }}"
          claude_args: >-
            --max-turns 80
            --allowedTools "Read,Grep,Glob,Skill,Agent,Bash(gh pr view*),Bash(gh pr diff*),Bash(gh pr comment*),Bash(git diff*),Bash(git log*),Bash(git show*)"
      - name: Check the review comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.scope.outputs.pr }}
          SHA: ${{ needs.scope.outputs.sha }}
        run: harness/scripts/check-review-comment.sh --pr "$PR" --sha "$SHA" --prefix Code-Review --skill review-code

  review-security:
    name: review-security
    needs: scope
    if: ${{ needs.scope.outputs.level != 'low' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.scope.outputs.sha }}
      - name: Run the skill in CI (only with a token)
        if: ${{ needs.scope.outputs.has_token == 'true' }}
        uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: "/review-security ${{ needs.scope.outputs.pr }}"
          claude_args: >-
            --max-turns 80
            --allowedTools "Read,Grep,Glob,Skill,Agent,Bash(gh pr view*),Bash(gh pr diff*),Bash(gh pr comment*),Bash(git diff*),Bash(git log*),Bash(git show*),Bash(gitleaks*),Bash(osv-scanner*)"
      - name: Check the review comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.scope.outputs.pr }}
          SHA: ${{ needs.scope.outputs.sha }}
        run: harness/scripts/check-review-comment.sh --pr "$PR" --sha "$SHA" --prefix Security-Review --skill review-security

  review-architecture:
    name: review-architecture
    needs: scope
    if: ${{ needs.scope.outputs.level == 'high' || needs.scope.outputs.architecture == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.scope.outputs.sha }}
      - name: Run the skill in CI (only with a token)
        if: ${{ needs.scope.outputs.has_token == 'true' }}
        uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: "/review-architecture ${{ needs.scope.outputs.pr }}"
          claude_args: >-
            --max-turns 80
            --allowedTools "Read,Grep,Glob,Skill,Agent,Bash(gh pr view*),Bash(gh pr diff*),Bash(gh pr comment*),Bash(git diff*),Bash(git log*),Bash(git show*)"
      - name: Check the review comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.scope.outputs.pr }}
          SHA: ${{ needs.scope.outputs.sha }}
        run: harness/scripts/check-review-comment.sh --pr "$PR" --sha "$SHA" --prefix Architektur-Review --skill review-architecture
